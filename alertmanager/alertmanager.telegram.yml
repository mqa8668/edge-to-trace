# Same route tree as alertmanager.yml; page and ticket also go to Telegram, Watchdog sends a slow heartbeat.
# The `# thread:*` lines are rewritten at container start (compose.telegram.yaml) from
# TELEGRAM_THREAD_PAGE / TELEGRAM_THREAD_TICKET / TELEGRAM_THREAD_HEARTBEAT. 0 means the main chat, no topic.
templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: sink
  group_by: [alertname, sloth_service, sloth_slo]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    # Watchdog: the sink keeps its 1m heartbeat, Telegram gets one silent line every 12h.
    - matchers: [alertname="Watchdog"]
      receiver: sink
      repeat_interval: 1m
      continue: true
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      repeat_interval: 12h
    # Synthetic test alerts (scripts/smoke.sh) stay in the sink and never reach Telegram.
    - matchers: [synthetic="true"]
      receiver: sink
    - matchers: [severity="page"]
      receiver: page
    - matchers: [severity="ticket"]
      receiver: ticket

# The page does not inhibit the ticket of the same SLO: an inhibited alert is never notified when it
# resolves, which would leave a dangling ticket in Telegram. Page and ticket are separate topics anyway.
inhibit_rules:
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [alertname="StorefrontAvailabilityBurn", severity="ticket"]

receivers:
  - name: sink
    webhook_configs: [{url: "http://alert-sink:9095/webhook"}]
  - name: page
    webhook_configs: [{url: "http://alert-sink:9095/webhook"}]
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        parse_mode: HTML
        http_config: {proxy_from_environment: true}
        message_thread_id: 0 # thread:page
        message: '{{ template "e2t.telegram" . }}'
  - name: ticket
    webhook_configs: [{url: "http://alert-sink:9095/webhook"}]
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        parse_mode: HTML
        http_config: {proxy_from_environment: true}
        disable_notifications: true
        message_thread_id: 0 # thread:ticket
        message: '{{ template "e2t.telegram" . }}'
  - name: heartbeat
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        parse_mode: HTML
        http_config: {proxy_from_environment: true}
        send_resolved: false
        disable_notifications: true
        message_thread_id: 0 # thread:heartbeat
        message: '{{ template "e2t.telegram.heartbeat" . }}'

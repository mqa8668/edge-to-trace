receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}
  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/healthz" or attributes["url.path"] == "/readyz"'
        - 'attributes["http.target"] == "/healthz" or attributes["http.target"] == "/readyz"'
        - 'attributes["http.route"] == "/healthz" or attributes["http.route"] == "/readyz"'
  resource:
    attributes:
      - {key: deployment.environment.name, value: lab, action: insert}
  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    policies:
      - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
      - {name: slow, type: latency, latency: {threshold_ms: 300}}
      - {name: baseline, type: probabilistic, probabilistic: {sampling_percentage: "${env:TAIL_SAMPLING_BASELINE_PERCENT}"}}

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 200ms, 300ms, 500ms, 800ms, 1s, 2s, 5s]
    dimensions:
      - name: http.request.method
      - name: http.route
      - name: http.response.status_code
    exemplars:
      enabled: true
    metrics_flush_interval: 15s
  servicegraph:
    metrics_flush_interval: 15s
    store:
      ttl: 10s
  forward/sample: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls: {insecure: true}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter, filter/health, resource]
      exporters: [spanmetrics, servicegraph, forward/sample]
    traces/sampled:
      receivers: [forward/sample]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics/derived:
      receivers: [spanmetrics, servicegraph]
      processors: [batch]
      exporters: [otlphttp/prometheus]
    metrics/apps:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]

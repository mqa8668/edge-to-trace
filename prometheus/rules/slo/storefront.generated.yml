          max(slo:sli_error:ratio_rate1d{sloth_id="storefront-latency", sloth_service="storefront", sloth_slo="latency"} > (3 * 0.01)) without (sloth_window)
      )
      or
      (
          max(slo:sli_error:ratio_rate6h{sloth_id="storefront-latency", sloth_service="storefront", sloth_slo="latency"} > (1 * 0.01)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate3d{sloth_id="storefront-latency", sloth_service="storefront", sloth_slo="latency"} > (1 * 0.01)) without (sloth_window)
      )
    labels:
      category: latency
      severity: ticket
      sloth_severity: ticket
    annotations:
      budget_left: '{{ with query "clamp_min(slo:period_error_budget_remaining:ratio{sloth_id=\"storefront-latency\"}
        * 100, 0)" }}{{ . | first | value | printf "%.2f" }}{{ end }}'
      burn_rate: '{{ with query "slo:sli_error:ratio_rate1d{sloth_id=\"storefront-latency\"}
        / on(sloth_id) slo:error_budget:ratio{sloth_id=\"storefront-latency\"}" }}{{
        . | first | value | printf "%.1f" }}x{{ end }}'
      burn_window: 1d
      dashboard_url: http://127.0.0.1:3000/d/e2t-slo?var-slo=latency
      runbook_url: https://github.com/mqa8668/edge-to-trace/blob/main/docs/runbooks/storefront-latency-burn.md
      slo_objective: 99% < 300ms
      summary: '{{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn
        rate is over expected.'
      tempo_url: http://127.0.0.1:3000/explore?schemaVersion=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22tempo%22%2C%22uid%22%3A%22tempo%22%7D%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7B%20resource.service.name%20%3D%20%5C%22storefront%5C%22%20%26%26%20duration%20%3E%20300ms%20%7D%22%7D%5D%7D%7D

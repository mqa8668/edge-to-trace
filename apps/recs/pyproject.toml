[project]
name = "recs"
version = "0.1.0"
description = "Acme Books recommendations service (FastAPI, OTel SDK)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn>=0.40",
    "httpx>=0.28",
    "python-json-logger>=3.3",
    "opentelemetry-distro>=0.66b0",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
